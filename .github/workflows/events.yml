name: Event bus tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "deploy/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/events.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "deploy/**"

jobs:
  unit:
    name: Unit tests (no broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - run: python -m pytest -q -m "not integration"
      - run: PYTHONPATH=src python -m events.demo

  integration:
    name: Round trip against a real Kafka broker
    runs-on: ubuntu-latest
    needs: unit
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - run: python -m pytest -q -m integration
        env:
          KAFKA_BOOTSTRAP: localhost:9092
      - run: PYTHONPATH=src python -m events.demo
        env:
          KAFKA_BOOTSTRAP: localhost:9092
