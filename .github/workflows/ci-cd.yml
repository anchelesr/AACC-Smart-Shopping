name: CI/CD

# One pipeline from commit to a running system:
#   lint -> tests (SQLite + PostgreSQL) -> manifests -> image (GHCR) -> deploy to a kind cluster -> smoke test.
# The deploy job proves the adaptation on a real Kubernetes cluster: it changes the energy signal and checks the node taints
# and the movement of the worker pod. Nothing here has run on GitHub yet when this file is written; see docs/implementation.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: v5.4.3
  KUBECONFORM_VERSION: v0.6.7
  PROMETHEUS_VERSION: 3.5.0
  K8S_SCHEMA_VERSION: 1.31.0

jobs:
  lint:
    name: Lint (Python, YAML, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.38.0
      - name: Python compiles
        run: python -m compileall -q src tests scripts
      - name: YAML
        run: yamllint -c .yamllint.yml deploy .github
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh

  test:
    name: Tests
    uses: ./.github/workflows/app.yml

  manifests:
    name: Kubernetes and monitoring files
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize, kubeconform and promtool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin" kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" kubeconform
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz -C "$HOME/bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build every overlay and validate it against the Kubernetes schema
        run: |
          for o in base overlays/kind overlays/ollama; do
            echo "== $o"
            kustomize build "deploy/k8s/$o" | kubeconform -strict -summary -kubernetes-version "$K8S_SCHEMA_VERSION"
          done
      - name: Prometheus rules and configuration
        run: |
          promtool check rules deploy/k8s/monitoring/rules.yml
          mkdir -p /tmp/prom && cp deploy/k8s/monitoring/rules.yml /tmp/prom/
          sed 's#/etc/prometheus/rules.yml#rules.yml#; s#credentials_file: .*#credentials_file: /etc/hostname#' deploy/k8s/monitoring/prometheus.yml > /tmp/prom/prometheus.yml
          promtool check config /tmp/prom/prometheus.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifests agree with the code and the exposed metrics
        run: |
          pip install -r requirements.txt pyyaml prometheus-client==0.26.0
          python -m pytest -q tests/test_k8s_manifests.py tests/test_deploy.py

  carbon-experiment:
    name: Carbon experiment is reproducible
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Re-run and compare with the committed result
        run: |
          PYTHONPATH=src python scripts/carbon_experiment.py --out /tmp/carbon-experiment.md
          diff -u docs/carbon-experiment.md /tmp/carbon-experiment.md

  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    needs: [test, manifests]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lower case)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (the same image is tested below and published on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts, answers and stops cleanly
        run: |
          docker run -d --name probe -p 18080:8080 -e SHOPPING_OPS_TOKEN=t -e SHOPPING_SEED_DEMO=1 "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for _ in $(seq 1 30); do curl -sf localhost:18080/health/ready && break; sleep 1; done
          curl -sf localhost:18080/products | python3 -c "import json,sys; assert len(json.load(sys.stdin)) == 6"
          test "$(docker exec probe id -u)" = "10001"
          docker stop -t 15 probe
          test "$(docker inspect probe --format '{{.State.ExitCode}}')" = "0"
      - name: Save the image for the deploy job
        run: docker save "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" -o /tmp/shopping-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-image
          path: /tmp/shopping-image.tar
          retention-days: 3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (commit SHA tag, and latest on main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:latest"

  deploy-kind:
    name: Deploy to kind and verify the adaptation
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shopping-image
          path: /tmp
      - name: Two-pool kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: shopping
          config: deploy/kind/kind-config.yaml
      - name: Load the image and deploy the kind overlay with exactly this commit's image
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          kind load image-archive /tmp/shopping-image.tar --name shopping
          sed -i "s#newName: shopping#newName: ${IMAGE}#; s#newTag: dev#newTag: ${TAG}#" deploy/k8s/overlays/kind/kustomization.yaml
          kubectl apply -k deploy/k8s/overlays/kind
      - name: Smoke test (health, metrics, taints and pod movement on a real cluster)
        shell: bash
        run: scripts/smoke.sh 2>&1 | tee smoke-output.txt
      - name: Diagnostics
        if: always()
        run: |
          kubectl get nodes -L energy-pool -o wide || true
          kubectl -n shopping get pods -o wide || true
          kubectl -n shopping get events --sort-by=.lastTimestamp | tail -40 || true
          for d in shopping-api shopping-worker shopping-controller; do echo "== $d"; kubectl -n shopping logs "deploy/$d" --tail=40 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-output.txt
