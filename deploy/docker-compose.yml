# Local Kafka for development and the demonstration:  docker compose -f deploy/docker-compose.yml up -d
# then:  KAFKA_BOOTSTRAP=localhost:9092 PYTHONPATH=src python -m events.demo
# PostgreSQL:  SHOPPING_DATABASE_URL=postgresql://shopping:shopping@localhost:5432/shopping PYTHONPATH=src python -m shopping --demo
services:
  postgres:                     # local development only: fixed demonstration password
    image: postgres:16
    ports: ["5432:5432"]
    environment: {POSTGRES_DB: shopping, POSTGRES_USER: shopping, POSTGRES_PASSWORD: shopping}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
  topics:                       # shares the network of the broker, so localhost:9092 is the broker
    image: apache/kafka:3.9.0
    network_mode: "service:kafka"
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BIN=/opt/kafka/bin
        $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic price.changed --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic mode.changed  --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic events.dead   --partitions 1 --replication-factor 1 --config retention.ms=1209600000
