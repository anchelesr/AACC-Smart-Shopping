# Local demonstration cluster: one control plane and two workers, one per energy pool.
# The label energy-pool is what the Placement Controller and the manifests use (nodeSelector, taint on the non-target pool).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopping
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "energy-pool=standard"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "energy-pool=eco"
