# Event Bus for Smart Shopping (ADR-012): Kafka in KRaft mode, one broker, for the demonstration cluster.
# Apply:  kubectl apply -f deploy/kafka/kafka.yaml && kubectl apply -f deploy/kafka/topics-job.yaml
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  clusterIP: None                 # headless: clients connect to kafka:9092, the broker advertises kafka-0.kafka
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
      annotations: {prometheus.io/scrape: "false"}    # broker metrics need a JMX exporter, not part of the MVP
    spec:
      securityContext: {fsGroup: 1000}
      nodeSelector: {energy-pool: standard}
      tolerations:                                    # the broker is not a flexible workload: it is never evicted
        - {key: energy-role, operator: Exists, effect: NoExecute}
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}   # topics come from the Job, typos do not create topics
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
