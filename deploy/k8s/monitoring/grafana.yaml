apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: shopping, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: shopping-monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: shopping-monitoring}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      tolerations:
        - {key: energy-role, operator: Exists, effect: NoExecute}
      nodeSelector: {energy-pool: standard}
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - {name: web, containerPort: 3000}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}          # demonstration: the dashboard opens without a login (read only)
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_DEFAULT_THEME, value: light}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/shopping.json}
          readinessProbe: {httpGet: {path: /api/health, port: web}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: provisioning-datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning-dashboards, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: provisioning-datasource, configMap: {name: grafana-provisioning}}
        - {name: provisioning-dashboards, configMap: {name: grafana-provisioning}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: web, port: 3000, targetPort: web}
