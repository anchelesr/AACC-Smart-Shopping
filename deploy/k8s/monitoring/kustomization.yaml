apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopping
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, rules.yml]
  - name: grafana-dashboards
    files: [shopping.json=dashboards/shopping.json]
generatorOptions:
  disableNameSuffixHash: true
