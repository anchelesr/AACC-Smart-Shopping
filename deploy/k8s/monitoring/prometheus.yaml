# Prometheus: discovers every pod labelled app.kubernetes.io/part-of=shopping and scrapes /metrics with the operator token.
# Stays on the standard pool and tolerates the energy taint, so the evidence of an adaptation is never lost with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-pod-discovery}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: shopping}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: shopping-monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: shopping-monitoring}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      tolerations:
        - {key: energy-role, operator: Exists, effect: NoExecute}
      nodeSelector: {energy-pool: standard}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe: {httpGet: {path: /-/ready, port: web}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: web}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: ops-token, mountPath: /etc/prometheus-secret, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: ops-token
          secret: {secretName: shopping-ops, items: [{key: token, path: token}]}
        - name: data
          emptyDir: {}                      # demonstration: history is lost when the pod is recreated
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web}
