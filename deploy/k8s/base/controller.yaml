# Carbon Monitor, Policy Engine and Placement Controller: exactly one replica (Recreate), tolerates the taint it sets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-controller
  labels: {app.kubernetes.io/name: shopping-controller, app.kubernetes.io/part-of: shopping}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: shopping-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shopping-controller, app.kubernetes.io/part-of: shopping, shopping/role: controller}
    spec:
      serviceAccountName: shopping-controller
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      # keeps running when the Placement Controller blocks its node pool: it must stay reachable in every mode
      tolerations:
        - {key: energy-role, operator: Exists, effect: NoExecute}
      initContainers:
        - name: wait-for-database
          image: ghcr.io/anchelesr/aacc-smart-shopping:latest
          command: ["python", "-c", "import socket,time,sys\nfor _ in range(120):\n    try:\n        socket.create_connection(('postgres', 5432), 2).close(); sys.exit(0)\n    except OSError:\n        time.sleep(2)\nsys.exit(1)"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: shopping
          image: ghcr.io/anchelesr/aacc-smart-shopping:latest
          args: ["--role", "controller", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: shopping-config}
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres, key: password}}}
            - name: SHOPPING_DATABASE_URL
              value: postgresql://shopping:$(POSTGRES_PASSWORD)@postgres:5432/shopping
            - {name: SHOPPING_OPS_TOKEN, valueFrom: {secretKeyRef: {name: shopping-ops, key: token}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10, failureThreshold: 3, initialDelaySeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
