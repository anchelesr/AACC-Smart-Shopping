# Local model runtime (Ollama). NO toleration and NO node selector on purpose: it is a flexible workload that the
# Placement Controller moves between the node pools, like the forecast worker. The models are baked into the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: shopping-monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: shopping-monitoring}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: ollama
          image: shopping-ollama:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: api, containerPort: 11434}
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: 30m}
          readinessProbe: {httpGet: {path: /api/tags, port: api}, periodSeconds: 5, failureThreshold: 6}
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports:
    - {name: api, port: 11434, targetPort: api}
